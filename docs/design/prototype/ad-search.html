<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>חיפוש חברים בדלת האחורית – אב טיפוס</title>
  <!-- The members search's suggestions (admin.css .ad-combo, #ad-sugg) on markup shaped like admin.js, without its inline styles.
       Sample people. Copy to public/ to view (not committed there). -->
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main class="bd" style="padding: 16px">
  <div class="card">
    <div class="ad-combo"><label class="ad-search"><input type="search" placeholder="שם, משפחה, אימייל או בית" aria-label="חיפוש חבר בכל הבתים" role="combobox" aria-controls="ad-sugg" aria-expanded="true" value="כהן"></label>
      <ul id="ad-sugg" role="listbox" aria-label="חברים שנמצאו">
        <li id="ad-sugg-0" role="option" aria-selected="false"><b>רחל כהן · Rachel</b><small class="muted"><span dir="ltr">rachel.cohen.family@example.com</span> · בית כהן</small></li>
        <li id="ad-sugg-1" role="option" aria-selected="true"><b>אברהם כהן</b><small class="muted"><span dir="ltr">avraham@example.com</span> · בית כהן</small></li>
        <li id="ad-sugg-2" role="option" aria-selected="false"><b>נועה כהן־לוי</b><small class="muted"><span dir="ltr">noa@example.com</span> · בית לוי</small></li>
      </ul></div>
    <p>הטבלה מתחת לרשימה.</p>
  </div>
</main>
</body>
</html>
