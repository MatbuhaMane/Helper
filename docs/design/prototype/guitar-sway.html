<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הגיטרה על הגדם</title>
  <!-- A sample for the home corner's two layers (stump.webp + guitar.webp, the same canvas) and the guitar-only sway.
       Copy to public/ to view (not committed there). Tap the guitar to strum. ?a=1.4 holds the guitar at that angle (to check the stump behind it). -->
  <link rel="stylesheet" href="/assets/base.css">
  <style>
    body { min-block-size: 100vh; display: grid; place-items: center; background: var(--chalk); }
    .stage { position: relative; inline-size: min(92vw, 520px); aspect-ratio: 1.25; }
    .corner { position: absolute; inset: 0; }
    /* as in index.html */
    .corner .stump { position: absolute; inset-inline-end: 22%; inset-block-end: 0; inline-size: 62%; block-size: auto; filter: drop-shadow(0 8px 6px rgba(30, 16, 8, .28)); pointer-events: none; -webkit-user-drag: none; }
    .corner .guitar { position: absolute; inset-inline-end: 60%; inset-block-end: 5%; inline-size: 25%; block-size: 56%; border-radius: 40% 40% 20% 20%; background: none; border: 0; cursor: pointer; }
    /* new: the guitar's own layer */
    .corner .guitar-img { position: absolute; inset-inline-end: 22%; inset-block-end: 0; inline-size: 62%; block-size: auto; pointer-events: none; -webkit-user-drag: none;
      filter: drop-shadow(0 8px 6px rgba(30, 16, 8, .28)); transform-origin: 74% 99%; }
    .corner.strum .guitar-img { animation: guitar-sway 1.1s var(--ease-river, ease-out); }
    @keyframes guitar-sway {
      0% { rotate: 0deg; translate: 0 0; }
      4% { translate: .7px 0; } 8% { translate: -.7px 0; } 12% { translate: .5px 0; }
      16% { rotate: 1.4deg; translate: -.5px 0; } 20% { translate: .3px 0; } 24% { translate: -.2px 0; } 28% { translate: 0 0; }
      36% { rotate: 0deg; } 54% { rotate: .55deg; } 72% { rotate: 0deg; } 86% { rotate: .12deg; }
      100% { rotate: 0deg; translate: 0 0; }
    }
    @media (prefers-reduced-motion: reduce) { .corner.strum .guitar-img { animation: none; } }
    :root[data-motion="reduce"] .corner.strum .guitar-img { animation: none; }
  </style>
</head>
<body>
<div class="stage"><div class="corner">
  <img class="stump" src="/assets/stump.webp" alt="" width="700" height="698" draggable="false">
  <img class="guitar-img" src="/assets/guitar.webp" alt="" width="700" height="698" draggable="false">
  <button class="guitar" type="button" aria-label="לפרוט על הגיטרה"></button>
</div></div>
<script>
  const corner = document.querySelector('.corner'), a = new URLSearchParams(location.search).get('a');
  if (a) corner.querySelector('.guitar-img').style.rotate = a + 'deg';
  corner.querySelector('.guitar').addEventListener('click', () => { corner.classList.remove('strum'); void corner.offsetWidth; corner.classList.add('strum'); });
  corner.addEventListener('animationend', () => corner.classList.remove('strum'));
</script>
</body>
</html>
