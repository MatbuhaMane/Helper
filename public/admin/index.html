<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>החדר של האוהל</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <style>
    /* the owner's room – kept here until design gives it a stylesheet of its own */
    .ad { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 14px 60px; }
    .ad > * { min-inline-size: 0; }
    .ad h2 { margin: 0 0 8px; font-size: 1.15rem; } .ad h3 { margin: 14px 0 6px; font-size: 1rem; }
    .ad-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .ad-bar .spacer { flex: 1; }
    .ad-nav { display: flex; flex-wrap: wrap; gap: 6px; position: sticky; inset-block-start: calc(var(--appbar-h, 56px) + 4px); z-index: 2; padding: 6px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
    .ad-nav a { padding: 4px 10px; border-radius: 10px; text-decoration: none; color: var(--text); font-size: .92rem; }
    .ad-nav a:hover { background: color-mix(in srgb, var(--primary) 14%, transparent); }
    .ad-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .ad-tile { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
    .ad-tile b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; } .ad-tile small { color: var(--muted); }
    .ad-tile.good b { color: var(--primary); } .ad-tile.bad b { color: var(--danger, #b42318); }
    .ad table { inline-size: 100%; border-collapse: collapse; font-size: .9rem; }
    .ad td, .ad th { padding: 6px 8px; border-block-end: 1px solid var(--line); text-align: start; vertical-align: top; }
    .ad th { color: var(--muted); font-weight: 500; }
    .ad .num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ad-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; align-items: end; margin-block: 10px; }
    .ad-form label { display: grid; gap: 4px; font-size: .88rem; color: var(--muted); }
    .ad input, .ad select, .ad textarea { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--card); color: var(--text); min-inline-size: 0; }
    .ad-set { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding-block: 10px; border-block-end: 1px solid var(--line); }
    .ad-set p { grid-column: 1 / -1; margin: 0; }
    .ad-scroll { overflow-x: auto; }
    .ad-gate { text-align: center; padding: 34px 18px; }
    .ad-gate .big { font-size: 3rem; line-height: 1; }
    .ad-alert { border-inline-start: 3px solid var(--danger, #b42318); }
    .ad-bars { display: flex; align-items: flex-end; gap: 3px; block-size: 70px; margin-block: 6px; }
    .ad-bars i { flex: 1; background: color-mix(in srgb, var(--primary) 70%, transparent); border-radius: 3px 3px 0 0; min-block-size: 2px; }
    .small { font-size: .88rem; }
  </style>
</head>
<!-- the owner's room: no player, no companion – nothing else runs next to it -->
<body data-vault="1" data-daemon="off">
  <main class="wide"></main>
  <script src="/assets/common.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
