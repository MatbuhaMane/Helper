<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>קניות ומתכונים</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/sheet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabList" aria-selected="true">רשימת קניות</button>
      <button role="tab" id="tabBook" aria-selected="false" data-guide="recipe-book-tab" data-guide-label="ספר המתכונים">ספר מתכונים</button>
      <button role="tab" id="tabKeto" aria-selected="false" data-guide="keto-tab" data-guide-label="קטוזיס">קטוזיס</button>
      <span class="spacer"></span>
      <span id="sync" class="sync"></span>
    </div>

    <section id="viewList">
      <form id="addForm" class="card add-form" autocomplete="off" data-guide="add-item" data-guide-label="הוספת פריט לרשימה">
        <input id="addInput" type="text" placeholder="הוסף פריט… (אפשר כמה, מופרדים בפסיק)" aria-label="פריט חדש">
        <select id="addCategory" aria-label="קטגוריה"><option value="">קטגוריה אוטומטית</option></select>
        <button type="submit" class="btn primary">הוסף</button>
        <div id="addHint" class="hint" role="status" aria-live="polite"></div>
      </form>

      <div id="dupBanner" class="card banner" hidden></div>

      <form id="recipeForm" class="card recipe-form" autocomplete="off" data-guide="recipe-search" data-guide-label="חיפוש מתכון ברשת">
        <input id="recipeInput" type="text" placeholder="חפש מתכון מכל העולם… (למשל: קרבונרה, ראמן, תבשיל עוף גאורגי)" aria-label="חיפוש מתכון">
        <button type="submit" class="btn accent">חפש מתכון</button>
      </form>

      <div class="toolbar">
        <label class="toggle"><input type="checkbox" id="hideChecked"> הסתר פריטים שסומנו</label>
        <button id="clearChecked" class="btn ghost">מחק מסומנים</button>
        <button id="shareList" class="btn ghost" data-guide="share" data-guide-label="שיתוף הרשימה">שיתוף</button>
      </div>

      <section id="list" aria-label="רשימת קניות" data-guide="list" data-guide-label="רשימת הקניות"></section>
    </section>

    <section id="viewBook" hidden>
      <div class="card book-tools">
        <input id="bookSearch" type="search" placeholder="חיפוש בספר המתכונים שלנו…" aria-label="חיפוש מתכון שמור">
      </div>
      <form id="bookWebForm" class="card recipe-form" autocomplete="off" role="search">
        <input id="bookWebInput" type="search" placeholder="חפש מתכון מכל העולם… (למשל: קרבונרה, ראמן, תבשיל עוף גאורגי)" aria-label="חיפוש מתכון באינטרנט">
        <button type="submit" class="btn accent">חפש מתכון</button>
      </form>
      <div id="bookGrid" class="book-grid"></div>

      <div class="fab-wrap">
        <div id="bookFabMenu" class="fab-menu" role="menu" hidden>
          <button id="bookNew" role="menuitem">✍️ כתיבת מתכון</button>
          <button id="bookImport" role="menuitem">🔗 ייבוא מקישור</button>
        </div>
        <button id="bookFab" class="fab" aria-label="הוספת מתכון" aria-haspopup="menu" aria-expanded="false" title="הוספת מתכון">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </section>

    <section id="viewKeto" class="keto" hidden aria-label="קטוזיס"></section>
  </main>

  <script src="/assets/common.js"></script>
  <script src="/assets/sheet.js"></script>
  <script src="data.js"></script>
  <script src="foods.js"></script>
  <script src="measure.js"></script>
  <script src="diets.js"></script>
  <script src="keto.js"></script>
  <script src="fix.js"></script>
  <script src="app.js"></script>
</body>
</html>
