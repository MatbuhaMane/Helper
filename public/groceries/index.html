<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>קניות ומתכונים</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabList" aria-selected="true">רשימת קניות</button>
      <button role="tab" id="tabBook" aria-selected="false" data-guide="recipe-book-tab" data-guide-label="ספר המתכונים">ספר מתכונים</button>
      <span class="spacer"></span>
      <span id="sync" class="sync"></span>
    </div>

    <section id="viewList">
      <form id="addForm" class="card add-form" autocomplete="off" data-guide="add-item" data-guide-label="הוספת פריט לרשימה">
        <input id="addInput" type="text" placeholder="הוסף פריט… (אפשר כמה, מופרדים בפסיק)" aria-label="פריט חדש">
        <select id="addCategory" aria-label="קטגוריה"><option value="">קטגוריה אוטומטית</option></select>
        <button type="submit" class="btn primary">הוסף</button>
        <div id="addHint" class="hint" role="status" aria-live="polite"></div>
      </form>

      <div id="dupBanner" class="card banner" hidden></div>

      <form id="recipeForm" class="card recipe-form" autocomplete="off" data-guide="recipe-search" data-guide-label="חיפוש מתכון ברשת">
        <input id="recipeInput" type="text" placeholder="חפש מתכון ברשת… (למשל: עוף, פסטה, chicken curry)" aria-label="חיפוש מתכון">
        <button type="submit" class="btn accent">חפש מתכון</button>
      </form>

      <div class="toolbar">
        <label class="toggle"><input type="checkbox" id="hideChecked"> הסתר פריטים שסומנו</label>
        <button id="clearChecked" class="btn ghost">מחק מסומנים</button>
        <button id="shareList" class="btn ghost" data-guide="share" data-guide-label="שיתוף הרשימה">שיתוף</button>
      </div>

      <section id="list" aria-label="רשימת קניות" data-guide="list" data-guide-label="רשימת הקניות"></section>
    </section>

    <section id="viewBook" hidden>
      <div class="card book-tools">
        <input id="bookSearch" type="search" placeholder="חיפוש בספר המתכונים…" aria-label="חיפוש מתכון שמור">
        <button id="bookNew" class="btn primary">מתכון חדש</button>
        <button id="bookImport" class="btn ghost">ייבוא מקישור</button>
      </div>
      <div id="bookGrid" class="book-grid"></div>
    </section>
  </main>

  <script src="/assets/common.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
