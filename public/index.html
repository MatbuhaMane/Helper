<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efeee6">
  <title>העוזר המשפחתי</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/assets/base.css">
  <style>
    /* The home page is a small camp: a greeting, Ibn Ezra's tent (he stands on its front rug), and the apps on a ring
       you can spin forever. No straight lines: the orbit, the ground and the bubbles are all round. */
    .home { display: grid; justify-items: center; padding-block: 12px 24px; gap: 2px; }
    @media (min-width: 900px) { .home { padding-block: 30px 40px; } }
    .greet { text-align: center; }
    .greet h1 { font-size: clamp(2.1rem, 1.3rem + 2.6vw, 3.2rem); line-height: 1.15; margin: 0 0 2px; --swell-color: var(--primary); }
    .greet p { margin: 0; color: var(--muted); font-size: 1.15rem; }

    .camp { position: relative; inline-size: min(100%, 640px, max(280px, (100dvh - var(--appbar-h) - var(--tabbar-h) - 495px) * 1.84)); margin-block-start: 4px; }
    @media (max-width: 599px) { .camp { inline-size: min(100%, 640px, max(250px, (100dvh - var(--appbar-h) - var(--tabbar-h) - 405px) * 1.84)); } }
    .camp::before { content: ''; position: absolute; inset-inline: 2% 2%; inset-block-end: -4%; block-size: 34%; border-radius: 50%;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--olive) 34%, transparent), transparent); pointer-events: none; }
    .camp img { position: relative; display: block; inline-size: 100%; block-size: auto; aspect-ratio: 1200 / 651; filter: drop-shadow(0 14px 18px rgba(46, 42, 30, .16)); animation: camp-in .9s var(--ease-river) both; }
    /* His spot: the patterned rug at the tent's entrance (63% from the image's left, 83% down; the image is not mirrored in RTL). */
    .camp .dock { position: absolute; inset-inline-start: 37%; inset-block-start: 83%; inline-size: 2px; block-size: 2px; pointer-events: none; }
    @keyframes camp-in { from { opacity: 0; transform: translateY(14px) scale(.97); } }

    /* The apps ring: cushions sitting around a small campfire; spinning the ring carries them round the fire. */
    .wheel { --cy: -14px; position: relative; isolation: isolate; inline-size: min(100%, 860px); block-size: 318px; margin-block-start: 0; touch-action: pan-y;
      -webkit-user-select: none; user-select: none; cursor: grab; outline: none; }
    .wheel.dragging { cursor: grabbing; }
    .wheel .orbit { position: absolute; inset: 0; margin: auto; inline-size: calc(var(--rx) * 2px + 60px); block-size: calc(var(--ry) * 2px + 44px); border-radius: 50%;
      border: 2px dashed color-mix(in srgb, var(--olive) 50%, transparent); transform: translateY(var(--cy)); pointer-events: none;
      background: radial-gradient(closest-side, color-mix(in srgb, #ff9a3c 22%, transparent), color-mix(in srgb, var(--olive) 10%, transparent) 55%, transparent); animation: glow 2.6s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .82; } }
    .wheel-item { position: absolute; inset: 0; margin: auto; inline-size: 180px; block-size: 178px; display: grid; justify-items: center; align-content: start; gap: 6px;
      text-decoration: none; color: var(--text); -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; will-change: transform, opacity; }
    .wheel-item:focus-visible { outline: none; }
    .wheel-item:focus-visible .pillow { filter: drop-shadow(0 0 0 var(--primary)) drop-shadow(0 0 6px var(--primary)); }
    .wheel-item .pillow { display: block; inline-size: 124px; block-size: 124px; overflow: visible; filter: drop-shadow(0 10px 9px rgba(30, 16, 8, .34)); transition: transform .35s var(--ease-river); }
    .wheel-item.front .pillow { animation: plump 3.4s ease-in-out infinite; }
    .wheel-item:active .pillow { transform: scale(.93, .88); }
    .wheel-item .label { font-size: 1.45rem; font-weight: 600; line-height: 1.15; text-align: center; white-space: nowrap; --swell-color: var(--c2); transition: opacity .3s; }
    .wheel-item.back .label { opacity: 0; }
    @keyframes plump { 50% { transform: translateY(-4px) scale(1.03, .98); } }
    .wheel .spin { position: absolute; inset-block-start: calc(50% + var(--cy) - 23px); z-index: 200; inline-size: 46px; block-size: 46px; border-radius: 50%; display: grid; place-items: center;
      background: var(--card); color: var(--text); border: 1px solid var(--line-strong); box-shadow: var(--lift); cursor: pointer; }
    .wheel .spin:hover { border-color: var(--primary); color: var(--primary); }
    .wheel .spin.next { inset-inline-end: 4px; }
    .wheel .spin.prev { inset-inline-start: 4px; }
    .wheel .spin svg { inline-size: 22px; block-size: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .wheel-caption { min-block-size: 2.6em; margin: 0; color: var(--muted); font-size: 1.05rem; text-align: center; max-inline-size: 34ch; }

    /* The campfire at the centre of the ring (cushions in front of it pass before the flames, those behind pass behind). */
    .fire { position: absolute; inset: 0; margin: auto; inline-size: 92px; block-size: 92px; z-index: 50; pointer-events: none; transform: translateY(calc(var(--cy) - 26px)); }
    .fire svg { inline-size: 100%; block-size: 100%; overflow: visible; }
    .fire .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.1s ease-in-out infinite alternate; }
    .fire .f2 { animation-duration: .8s; animation-delay: -.3s; }
    .fire .f3 { animation-duration: .95s; animation-delay: -.6s; }
    .fire .spark { animation: spark 2.2s linear infinite; opacity: 0; }
    .fire .spark:nth-of-type(2) { animation-delay: -.7s; } .fire .spark:nth-of-type(3) { animation-delay: -1.4s; }
    .fire .halo { animation: halo 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes flick { 0% { transform: scale(1, 1) skewX(0); } 35% { transform: scale(.94, 1.08) skewX(3deg); } 70% { transform: scale(1.05, .93) skewX(-3deg); } 100% { transform: scale(.97, 1.04) skewX(1.5deg); } }
    @keyframes spark { 0% { opacity: 0; transform: translate(0, 0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--sx, 6px), -46px); } }
    @keyframes halo { to { opacity: .65; transform: scale(1.08); } }

    @media (max-width: 599px) {
      .wheel { --cy: -26px; block-size: 236px; }
      .wheel-item { inline-size: 150px; block-size: 146px; }
      .wheel-item .pillow { inline-size: 100px; block-size: 100px; }
      .wheel-item .label { font-size: 1.28rem; }
      .wheel .spin { display: none; }   /* on a phone the ring is spun with a finger */
      .fire { inline-size: 74px; block-size: 74px; transform: translateY(calc(var(--cy) - 20px)); }
    }

    /* Letters that swell: each one grows toward the pointer (or ripples in a wave on a long press). */
    .swell { display: inline-block; }
    .swell .ch { display: inline-block; transform-origin: 50% 85%; transition: transform .45s var(--ease-river), color .45s; will-change: transform; }
    .swell.live .ch { transition: transform .09s linear, color .2s; }
    .swell .ch.sp { white-space: pre; }
    .swell .word { display: inline-block; unicode-bidi: isolate; white-space: nowrap; }
    .swell .ch { color: color-mix(in oklab, var(--swell-color, var(--primary)) calc(var(--k, 0) * 100%), currentColor); transform: translateY(calc(var(--k, 0) * -0.2em)) scale(calc(1 + var(--k, 0) * .55)); }
    .swell.wave .ch { animation: wave 1.1s var(--ease-river) calc(var(--i) * 55ms) both; }
    @keyframes wave { 35% { transform: translateY(-.28em) scale(1.55); color: var(--swell-color, var(--primary)); } }

    body[data-daemon="hero"]:has(.dm-stage) main { padding-block-end: 32px; }
    @media (prefers-reduced-motion: reduce) { .camp img, .wheel-item.front .pillow, .swell.wave .ch, .fire *, .wheel .orbit { animation: none !important; } }

    .login { max-width: 460px; margin: 10vh auto; padding: 32px 28px; text-align: center; }
    .login h1 { font-size: 2rem; margin: 0 0 8px; }
    .login p { color: var(--muted); }
    .gbtn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; background: var(--card); color: var(--text); border: 1px solid var(--line-strong); border-radius: 999px; padding: 12px 22px; font-weight: 500; margin-top: 10px; }
    .gbtn:hover { border-color: var(--primary); }
    .gbtn svg { width: 20px; height: 20px; }
    .out { text-align: center; margin-top: 18px; }
  </style>
</head>
<body data-daemon="hero">
  <main class="wide" id="root"></main>
  <script src="/assets/common.js"></script>
  <script src="/assets/pillows.js"></script>
  <script>
  (async () => {
    const { el } = H;
    const root = document.getElementById('root');
    const qs = new URLSearchParams(location.search);
    const r = await H.me();
    H.header('');

    if (!r.user) {
      const next = qs.get('next') || '/';
      const err = qs.get('error');
      root.append(el('div', { class: 'card login' },
        el('h1', {}, 'העוזר המשפחתי'),
        el('p', {}, 'רשימת קניות משותפת, מתכונים, חדשות וסידור המייל – לכל המשפחה.'),
        err === 'not_invited' ? el('p', { class: 'notice warn' }, `החשבון ${qs.get('email') || ''} עוד לא הוזמן. בקשו ממנהל המשפחה להוסיף אתכם.`) : null,
        el('a', { class: 'gbtn', href: '/api/auth/login?next=' + encodeURIComponent(next) },
          el('span', { html: '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg>' }),
          'התחברות עם Google'),
        r.dev ? el('p', {}, el('a', { href: '/api/auth/dev?email=' + encodeURIComponent(r.devEmail) + '&name=Mishael&next=/' }, 'כניסת תצוגה מקדימה (פיתוח)')) : null));
      return;
    }

    const u = r.user;
    const first = (u.name || u.email).split(' ')[0];
    const apps = [
      // each app is a cushion in its own weave (c2: the colour its letters glow in when they swell)
      { href: '/groceries/', ic: 'cart', name: 'קניות ומתכונים', sub: 'רשימה משותפת לבית וספר מתכונים', palette: 'tatreez', weave: 'tatreez', c2: '#d8283f' },
      { href: '/news/', ic: 'news', name: 'חדשות', sub: 'כל האתרים, מישראל ומהעולם, במקום אחד', palette: 'indigo', weave: 'arrows', c2: '#4a63b8' },
      { href: '/songs/', ic: 'music', name: 'שירון', sub: 'מילים, אקורדים לגיטרה ולפסנתר, וזמירות שבת', palette: 'kilim', weave: 'zigzag', c2: '#e2711d' },
      { href: '/mail/', ic: 'mail', name: 'סידור המייל', sub: 'מסבירים במילים, מאשרים, וזה מסתדר', palette: 'teal', weave: 'stripes', c2: '#2c7c78' },
      { href: '/pc/', ic: 'pc', name: 'סידור המחשב', sub: 'קבצים ותיקיות, תמיד עם גיבוי', palette: 'rust', weave: 'grid', c2: '#c0562b' },
    ];
    if (u.role === 'owner') apps.push({ href: '/admin/', ic: 'family', name: 'ניהול משפחה', sub: 'מי יכול להשתמש בעוזר', palette: 'wine', weave: 'tatreez', c2: '#3f8150' });

    const dock = el('span', { class: 'dock', 'aria-hidden': 'true' });
    const wheel = appWheel(apps);
    root.append(el('div', { class: 'home' },
      el('div', { class: 'greet' }, el('h1', {}, swell(`שלום ${first}`)), el('p', {}, 'במה נתחיל היום?')),
      el('div', { class: 'camp' }, el('img', { src: '/assets/tent.webp', alt: 'האוהל של ראב"ע', width: 1200, height: 651, fetchpriority: 'high' }), dock),
      wheel.root, wheel.caption,
      el('p', { class: 'out' }, el('button', { class: 'btn ghost small', onclick: async () => { await H.api('/api/auth/logout', { method: 'POST' }); location.reload(); } }, 'התנתקות'))));
    wheel.start();
    swellPointer();
    // Ibn Ezra lives here: he stands on the rug at his tent's entrance (unless he was asked to come along with the person).
    H.loadDaemon().then((d) => d.mount(null, { dock }));

    /* ---------- letters that swell ---------- */
    function swell(text) {
      const parts = window.Intl?.Segmenter ? [...new Intl.Segmenter('he', { granularity: 'grapheme' }).segment(text)].map((s) => s.segment) : [...text];
      // letters are grouped into words, each in its own direction (separate letter boxes would otherwise lose a Latin name's order in RTL)
      const out = el('span', { class: 'swell', role: 'text', 'aria-label': text });
      let word = null;
      parts.forEach((c, i) => {
        if (/\s/.test(c)) { word = null; out.append(el('span', { class: 'ch sp', 'aria-hidden': 'true', style: `--i:${i}` }, c)); return; }
        if (!word) { word = el('span', { class: 'word', dir: /[A-Za-z0-9]/.test(c) ? 'ltr' : 'rtl', 'aria-hidden': 'true' }); out.append(word); }
        word.append(el('span', { class: 'ch', style: `--i:${i}` }, c));
      });
      return out;
    }
    /** Every letter grows by how close the pointer is (a magnifier that follows the mouse); a long press sends a wave through them. */
    function swellPointer() {
      let live = null;
      const reset = (w) => { w.classList.remove('live'); w.querySelectorAll('.ch').forEach((c) => c.style.removeProperty('--k')); };
      const apply = (w, x, y) => {
        const chars = w.querySelectorAll('.ch');
        const box = w.getBoundingClientRect();
        const ky = Math.exp(-(((y - (box.top + box.height / 2)) / Math.max(40, box.height * 1.6)) ** 2));
        const em = parseFloat(getComputedStyle(w).fontSize) || 20;
        // letter centres from the layout (offsets ignore the swell's own transforms, so the magnifier doesn't chase itself),
        // scaled by whatever the ring's scale does to the label
        const k = box.width / Math.max(1, w.offsetWidth);
        for (const c of chars) {
          const cx = box.left + (c.offsetLeft - w.offsetLeft + c.offsetWidth / 2) * k;
          const d = (x - cx) / (em * 1.15 * k);
          c.style.setProperty('--k', (Math.exp(-d * d) * ky).toFixed(3));
        }
      };
      document.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch' && !e.buttons) return;
        const host = e.target.closest?.('.wheel-item, .greet h1');
        const w = host?.querySelector('.swell') || null;
        if (live && live !== w) { reset(live); live = null; }
        if (!w || host.closest('.wheel.dragging')) { if (live) { reset(live); live = null; } return; }
        live = w; w.classList.add('live');
        apply(w, e.clientX, e.clientY);
      }, { passive: true });
      document.addEventListener('pointerleave', () => { if (live) { reset(live); live = null; } });
      // a long press (a finger that stays put): a wave through the letters
      let lp = null;
      document.addEventListener('pointerdown', (e) => {
        const host = e.target.closest?.('.wheel-item, .greet h1');
        if (!host) return;
        const w = host.querySelector('.swell');
        const at = { x: e.clientX, y: e.clientY };
        clearTimeout(lp?.t);
        lp = { at, t: setTimeout(() => { wave(w); lp.fired = true; navigator.vibrate?.(12); }, 380) };
      });
      document.addEventListener('pointermove', (e) => { if (lp && Math.hypot(e.clientX - lp.at.x, e.clientY - lp.at.y) > 8) clearTimeout(lp.t); }, { passive: true });
      document.addEventListener('pointerup', () => { if (lp) clearTimeout(lp.t); });
      // after a long press the finger lifts: that is not a tap on the app
      document.addEventListener('click', (e) => { if (lp?.fired) { lp = null; e.preventDefault(); e.stopPropagation(); } }, true);
      document.addEventListener('contextmenu', (e) => { if (e.target.closest?.('.wheel-item')) e.preventDefault(); });
      const greetSwell = document.querySelector('.greet .swell');
      if (greetSwell && !matchMedia('(prefers-reduced-motion: reduce)').matches) setTimeout(() => wave(greetSwell), 500);
    }
    function wave(w) {
      if (!w) return;
      w.classList.remove('wave'); void w.offsetWidth; w.classList.add('wave');
      clearTimeout(w._wave); w._wave = setTimeout(() => w.classList.remove('wave'), 1100 + w.querySelectorAll('.ch').length * 55);
    }

    /* ---------- the campfire in the middle of the ring ---------- */
    function campfire() {
      return el('div', { class: 'fire', 'aria-hidden': 'true', html: `<svg viewBox="0 0 100 100">
        <defs>
          <radialGradient id="fireHalo"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ff7b00" stop-opacity="0"/></radialGradient>
          <linearGradient id="flameOut" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e2420e"/><stop offset=".6" stop-color="#f7801c"/><stop offset="1" stop-color="#ffb43a"/></linearGradient>
          <linearGradient id="flameIn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9a1f"/><stop offset="1" stop-color="#fff1a6"/></linearGradient>
        </defs>
        <ellipse class="halo" cx="50" cy="80" rx="46" ry="20" fill="url(#fireHalo)"/>
        <g fill="#6f6a60" stroke="#4a463f" stroke-width="1.2">
          <ellipse cx="22" cy="84" rx="7" ry="4.5"/><ellipse cx="34" cy="89" rx="7" ry="4.5"/><ellipse cx="50" cy="91" rx="7.5" ry="4.5"/>
          <ellipse cx="66" cy="89" rx="7" ry="4.5"/><ellipse cx="78" cy="84" rx="7" ry="4.5"/>
        </g>
        <g stroke-linecap="round"><path d="M28 86 L70 70" stroke="#5a3620" stroke-width="8"/><path d="M72 86 L30 70" stroke="#7a4a2a" stroke-width="8"/>
          <circle cx="70" cy="70" r="3.4" fill="#d9a46a"/><circle cx="30" cy="70" r="3.4" fill="#e3b27a"/></g>
        <path class="flame f1" d="M50 18 C62 36 72 46 66 64 C62 76 38 76 34 64 C28 48 44 40 50 18Z" fill="url(#flameOut)"/>
        <path class="flame f2" d="M38 40 C44 50 50 56 46 68 C42 74 32 72 32 63 C31 54 36 50 38 40Z" fill="url(#flameOut)" opacity=".9"/>
        <path class="flame f3" d="M51 38 C58 50 62 56 58 66 C55 72 45 72 43 65 C41 56 48 50 51 38Z" fill="url(#flameIn)"/>
        <circle class="spark" cx="48" cy="34" r="1.6" fill="#ffd27a" style="--sx:-8px"/><circle class="spark" cx="54" cy="30" r="1.3" fill="#ffe7a3" style="--sx:9px"/><circle class="spark" cx="50" cy="38" r="1.2" fill="#ffc45e" style="--sx:3px"/>
      </svg>` });
    }

    /* ---------- the apps ring: spin it with a finger, the mouse, the arrows; it never ends ---------- */
    function appWheel(list) {
      const N = list.length, step = (Math.PI * 2) / N;
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const caption = el('p', { class: 'wheel-caption', 'aria-live': 'polite' });
      const orbit = el('div', { class: 'orbit', 'aria-hidden': 'true' });
      const arrow = (d) => el('span', { html: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>` }).firstChild;
      const prev = el('button', { class: 'spin prev', type: 'button', 'aria-label': 'האפליקציה הקודמת' }, arrow('M9 5l7 7-7 7'));
      const next = el('button', { class: 'spin next', type: 'button', 'aria-label': 'האפליקציה הבאה' }, arrow('M15 5l-7 7 7 7'));
      const items = list.map((a, i) => el('a', { class: 'wheel-item', href: a.href, 'data-guide': 'app-' + a.ic, 'data-guide-label': a.name, style: `--c2:${a.c2}`, draggable: 'false' },
        el('span', { html: H.pillow({ palette: a.palette, weave: a.weave, icon: H.icon(a.ic).innerHTML, id: 'pw' + i }) }).firstElementChild, el('b', { class: 'label' }, swell(a.name))));
      const root = el('nav', { class: 'wheel', 'aria-label': 'האפליקציות', 'aria-roledescription': 'גלגל' }, orbit, campfire(), ...items, prev, next);
      // off: how far the cushion's centre sits above the item box's centre (the ring passes through the cushions' centres)
      let rot = reduced ? 0 : -1.6, vel = 0, goal = 0, rx = 300, ry = 60, cy = 0, off = 0, raf = 0, last = 0, drag = null, front = -1;
      const mod = (n) => ((n % N) + N) % N;

      function measure() {
        const w = root.clientWidth;
        const small = w < 600;
        rx = Math.max(110, Math.min(small ? w / 2 - 58 : w / 2 - 120, 360));
        ry = small ? 46 : 64;
        cy = parseFloat(getComputedStyle(root).getPropertyValue('--cy')) || 0;
        const pil = items[0].querySelector('.pillow');
        const ph = parseFloat(getComputedStyle(pil).height) || 100;   // (an SVG has no offsetHeight)
        off = items[0].offsetHeight / 2 - ph / 2;
        items.forEach((it) => { it.style.transformOrigin = `50% ${ph / 2}px`; });
        root.style.setProperty('--rx', rx); root.style.setProperty('--ry', ry);
      }
      function layout() {
        items.forEach((it, i) => {
          const th = (i - rot) * step, c = Math.cos(th), s = Math.sin(th);
          const depth = (c + 1) / 2;   // 1 in front, 0 at the back
          const sc = 0.5 + 0.5 * depth;
          it.style.transform = `translate(${(-s * rx).toFixed(1)}px, ${(c * ry + cy + off).toFixed(1)}px) scale(${sc.toFixed(3)})`;
          it.style.opacity = (0.28 + 0.72 * depth ** 1.4).toFixed(3);
          it.style.zIndex = String(Math.round(depth * 100));
          it.classList.toggle('back', depth < 0.4);
        });
        const f = mod(Math.round(rot));
        if (f !== front) {
          front = f;
          items.forEach((it, i) => { it.classList.toggle('front', i === f); it.tabIndex = i === f ? 0 : -1; it.setAttribute('aria-current', i === f ? 'true' : 'false'); });
          caption.textContent = list[f].sub;
        }
      }
      function tick(now) {
        const dt = Math.min(0.05, (now - (last || now)) / 1000);
        last = now;
        if (!drag) {
          if (Math.abs(vel) > 0.5) { rot += vel * dt; vel *= Math.exp(-dt * 2.4); goal = Math.round(rot + vel * 0.3); }
          else { vel = 0; rot += (goal - rot) * Math.min(1, dt * (reduced ? 60 : 8)); }
        }
        layout();
        if (drag || Math.abs(vel) > 0.5 || Math.abs(goal - rot) > 0.0015) raf = requestAnimationFrame(tick);
        else { rot = goal; layout(); raf = 0; last = 0; }
      }
      const run = () => { if (!raf) raf = requestAnimationFrame(tick); };
      /** Spin to an app the shortest way round. */
      function spinTo(i) { const d = mod(i - Math.round(rot) + Math.floor(N / 2)) - Math.floor(N / 2); vel = 0; goal = Math.round(rot) + d; run(); }

      // a finger or the mouse: the ring follows the hand, then keeps spinning by its momentum and settles on an app
      root.addEventListener('pointerdown', (e) => {
        if (e.button > 0 || e.target.closest('.spin')) return;
        drag = { x: e.clientX, rot0: rot, moved: false, t: performance.now(), lx: e.clientX, v: 0, id: e.pointerId };
        vel = 0; run();
      });
      root.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x;
        if (!drag.moved && Math.abs(dx) > 7) { drag.moved = true; root.classList.add('dragging'); try { root.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ } }
        if (!drag.moved) return;
        const per = rx * step;   // pixels per app at the front
        rot = drag.rot0 + dx / per;
        const now = performance.now(), dt = Math.max(1, now - drag.t) / 1000;
        drag.v = drag.v * 0.6 + (((e.clientX - drag.lx) / per) / dt) * 0.4;
        drag.t = now; drag.lx = e.clientX;
      });
      const end = (e) => {
        if (!drag || (e.pointerId != null && e.pointerId !== drag.id)) return;
        const moved = drag.moved;
        vel = moved && performance.now() - drag.t < 90 ? Math.max(-14, Math.min(14, drag.v)) : 0;
        goal = Math.round(rot + vel * 0.3);
        drag = moved ? { done: true } : null;
        root.classList.remove('dragging');
        if (moved) setTimeout(() => { if (drag?.done) drag = null; run(); }, 0);
        run();
      };
      root.addEventListener('pointerup', end);
      root.addEventListener('pointercancel', end);
      // a tap on an app in front opens it; a tap on another one spins it to the front
      root.addEventListener('click', (e) => {
        const it = e.target.closest('.wheel-item');
        if (!it) return;
        const i = items.indexOf(it);
        if (root.dataset.justDragged) { e.preventDefault(); return; }
        if (i !== front) { e.preventDefault(); spinTo(i); }
      });
      root.addEventListener('pointerup', () => { if (root.classList.contains('dragging') || drag?.done) { root.dataset.justDragged = '1'; setTimeout(() => delete root.dataset.justDragged, 60); } }, true);
      // a trackpad's sideways swipe (or shift + wheel)
      let wheelEnd;
      root.addEventListener('wheel', (e) => {
        const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.shiftKey ? e.deltaY : 0;
        if (!d) return;
        e.preventDefault();
        rot -= d / (rx * step); vel = 0; goal = rot; run();
        clearTimeout(wheelEnd); wheelEnd = setTimeout(() => { goal = Math.round(rot); run(); }, 120);
      }, { passive: false });
      // keys: right-to-left, so ← is the next app
      root.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault();
          spinTo(front + (e.key === 'ArrowLeft' ? 1 : -1));
          setTimeout(() => items[front]?.focus({ preventScroll: true }), 30);
        }
      });
      next.addEventListener('click', () => spinTo(front + 1));
      prev.addEventListener('click', () => spinTo(front - 1));
      window.addEventListener('resize', () => { measure(); layout(); });

      return { root, caption, start() { measure(); layout(); goal = 0; setTimeout(run, reduced ? 0 : 250); } };
    }
  })();
  </script>
</body>
</html>
