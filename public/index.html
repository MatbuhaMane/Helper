<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efeee6">
  <title>הָאֹ֔הֶל</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/assets/icons/ohel-favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/assets/icons/ohel-icon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/icons/ohel-small.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/ohel-apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/care.css">
  <link rel="stylesheet" href="/assets/seasons.css">
  <link rel="stylesheet" href="/assets/arrange.css">
  <link rel="stylesheet" href="/assets/campfire.css">
  <style>
    /* The home page is a small camp: a greeting, Ibn Ezra's tent (he stands on its front rug), and the apps on a ring
       you can spin forever. No straight lines: the orbit, the ground and the bubbles are all round. */
    .home { display: grid; justify-items: center; padding-block: 12px 24px; gap: 2px; }
    @media (min-width: 900px) { .home { padding-block: 30px 40px; } }
    /* the greeting on top, on its own; under it the sky has a room of its own (about a sun high), where the sun and the moon
       arc over the tent; the horizon runs across the tent (see orbitGeometry()) */
    .home { --sky-room: 132px; }
    @media (max-width: 999px) { .home { --sky-room: 108px; } }
    @media (max-width: 599px) { .home { --sky-room: 84px; } }
    .greet { text-align: start; justify-self: start; padding-inline-start: 8px; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 12px; }
    @media (max-width: 599px) { .greet { padding-inline-start: 2px; } }
    .greet h1 { font-size: clamp(2.1rem, 1.3rem + 2.6vw, 3.2rem); line-height: 1.15; margin: 0 0 2px; --swell-color: var(--primary); }

    .camp { position: relative; inline-size: min(100%, 640px, max(280px, (100dvh - var(--appbar-h) - var(--tabbar-h) - 501px) * 1.76)); margin-block-start: var(--sky-room); }
    @media (max-width: 599px) { .camp { inline-size: min(100%, 640px, max(250px, (100dvh - var(--appbar-h) - var(--tabbar-h) - 449px) * 1.76)); } }
    .camp::before { content: ''; position: absolute; inset-inline: 2% 2%; inset-block-end: -4%; block-size: 34%; border-radius: 50%;
      background: radial-gradient(closest-side, color-mix(in srgb, var(--olive) 34%, transparent), transparent); pointer-events: none; }
    .camp > img { position: relative; display: block; inline-size: 100%; block-size: auto; aspect-ratio: 1400 / 794; filter: drop-shadow(0 14px 18px rgba(46, 42, 30, .16)); animation: camp-in .9s var(--ease-river) both; }
    /* His spot: the patterned orange rug at the tent's entrance (65.5% from the image's left, 78% down; the image is not mirrored in RTL). */
    .camp .wake { position: absolute; inset-inline-start: 26%; inset-block-start: 66%; }
    .camp .dock { position: absolute; inset-inline-start: 34.5%; inset-block-start: 78%; inline-size: 2px; block-size: 2px; pointer-events: none; }
    @keyframes camp-in { from { opacity: 0; transform: translateY(14px) scale(.97); } }
    /* The light of the sky on the tent: when the sun or the moon is low and near the tent (on a phone it passes right behind
       it), a soft halo glows round the tent's outline on the source's side, and a gentle light falls on the canvas from there –
       gold from the sun, silver from the moon (at dusk both, one on each side). Both are cut to the tent's own shape (its
       picture is the mask); paint() in sky() sets --sun-lit/--moon-lit (0–1), where the source stands (--*-u, --*-v) and
       which way the halo leans (--*-dx, --*-dy). No motion of its own: it only follows the sky. */
    .camp > .tent-light { position: absolute; inset: 0; pointer-events: none; animation: camp-in .9s var(--ease-river) both; }
    .camp > .tent-glow { filter: blur(11px); opacity: calc(var(--lit, 0) * .9); transform: translate(var(--dx, 0px), var(--dy, 0px)); will-change: opacity, transform; }
    .camp > .tent-glow i, .camp > .tent-shine { -webkit-mask: url(/assets/tent-mask.webp) 0 0 / 100% 100% no-repeat; mask: url(/assets/tent-mask.webp) 0 0 / 100% 100% no-repeat; }
    .camp > .tent-glow i { position: absolute; inset: 0; background: var(--glow); }
    :root[data-theme="dark"] .camp > .tent-shine { opacity: .72; }   /* at night the canvas is dark, and the same light reads stronger */
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .camp > .tent-shine { opacity: .72; } }
    .camp > .tent-glow.glow-sun { --lit: var(--sun-lit); --dx: var(--sun-dx); --dy: var(--sun-dy); --glow: rgb(255, 184, 82); }
    .camp > .tent-glow.glow-moon { --lit: var(--moon-lit); --dx: var(--moon-dx); --dy: var(--moon-dy); --glow: rgb(196, 214, 255); }
    .camp > .tent-shine { mix-blend-mode: screen;
      background: radial-gradient(ellipse 58% 90% at var(--sun-u, -60%) var(--sun-v, 50%), rgb(255 188 92 / calc(var(--sun-lit, 0) * .56)), transparent 72%),
                  radial-gradient(ellipse 58% 90% at var(--moon-u, 160%) var(--moon-v, 50%), rgb(198 214 255 / calc(var(--moon-lit, 0) * .48)), transparent 72%); }

    /* The apps ring: cushions sitting around a small campfire; spinning the ring carries them round the fire. */
    .wheel { --cy: -6px; position: relative; isolation: isolate; inline-size: min(100%, 860px); block-size: 374px; margin-block-start: 0; touch-action: pan-y;
      -webkit-user-select: none; user-select: none; cursor: grab; outline: none; }
    .wheel.dragging { cursor: grabbing; }
    .wheel .orbit { position: absolute; inset: 0; margin: auto; inline-size: calc(var(--rx) * 2px + 60px); block-size: calc(var(--ry) * 2px + 44px); border-radius: 50%;
      border: 2px dashed color-mix(in srgb, var(--olive) 50%, transparent); transform: translateY(var(--cy)); pointer-events: none;
      background: radial-gradient(closest-side, color-mix(in srgb, #ff9a3c 22%, transparent), color-mix(in srgb, var(--olive) 10%, transparent) 55%, transparent); animation: glow 2.6s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .82; } }
    .wheel-item { position: absolute; inset: 0; margin: auto; inline-size: 180px; block-size: 178px; display: grid; justify-items: center; align-content: start; gap: 6px;
      text-decoration: none; color: var(--text); -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; will-change: transform, opacity; }
    .wheel-item:focus-visible { outline: none; }
    .wheel-item:focus-visible .pillow img { outline: 3px solid var(--primary); outline-offset: 4px; border-radius: 16px; }
    .wheel-item .pillow { position: relative; display: grid; place-items: center; inline-size: 132px; block-size: 124px; transition: transform .35s var(--ease-river); }
    .wheel-item .pillow img { max-inline-size: 100%; max-block-size: 100%; filter: drop-shadow(0 10px 8px rgba(30, 16, 8, .32)); -webkit-user-drag: none; }
    /* the app's sign: a small round badge sewn on the cushion's lower edge, so the weave stays in view */
    /* the app's sign on the cushion: just the drawn icon, light with a dark edge so it reads on any weave */
    .wheel-item .badge { position: absolute; inset-block-end: 16%; inset-inline-start: calc(50% - 19px); inline-size: 38px; block-size: 38px; display: grid; place-items: center; color: #fffaf0; pointer-events: none; }
    .wheel-item .badge .icon { inline-size: 32px; block-size: 32px; stroke-width: 2.4;
      filter: drop-shadow(0 0 1.5px rgba(20, 10, 4, .95)) drop-shadow(0 0 1px rgba(20, 10, 4, .95)) drop-shadow(0 2px 4px rgba(0, 0, 0, .55)); }
    .wheel-item.front .pillow { animation: plump 3.4s ease-in-out infinite; }
    .wheel-item:active .pillow { transform: scale(.93, .88); }
    .wheel-item .label { font-size: 1.45rem; font-weight: 600; line-height: 1.15; text-align: center; white-space: nowrap; --swell-color: var(--c2); transition: opacity .3s; }
    .wheel-item.back .label { opacity: 0; }
    @keyframes plump { 50% { transform: translateY(-4px) scale(1.03, .98); } }
    .wheel .spin { position: absolute; inset-block-start: calc(50% + var(--cy) - 23px); z-index: 200; inline-size: 46px; block-size: 46px; border-radius: 50%; display: grid; place-items: center;
      background: var(--card); color: var(--text); border: 1px solid var(--line-strong); box-shadow: var(--lift); cursor: pointer; }
    .wheel .spin:hover { border-color: var(--primary); color: var(--primary); }
    .wheel .spin.next { inset-inline-end: 4px; }
    .wheel .spin.prev { inset-inline-start: 4px; }
    .wheel .spin svg { inline-size: 22px; block-size: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .wheel-caption { min-block-size: 2.6em; margin: 0; color: var(--muted); font-size: 1.05rem; text-align: center; max-inline-size: 34ch; }

    /* The campfire at the centre of the ring (cushions in front of it pass before the flames, those behind pass behind):
       drawn in the tent's style, its flames moving in code (/assets/campfire.js and campfire.css), and the warm light it
       casts on the ground around it, breathing with the flames (--cf-heat). */
    .fire { --fw: 168px; position: absolute; inset: 0; margin: auto; inline-size: var(--fw); block-size: calc(var(--fw) * 403 / 640); z-index: 50; pointer-events: none;
      transform: translateY(calc(var(--cy) - 20px)); }
    .fire .ground { position: absolute; inset: auto -110% -55%; block-size: 150%; border-radius: 50%; pointer-events: none; z-index: -1;
      background: radial-gradient(closest-side, rgba(255, 150, 50, calc(.2 + var(--cf-heat, .5) * .16)), rgba(255, 120, 30, .1) 45%, transparent 75%); }
    :root[data-theme="dark"] .fire .ground { mix-blend-mode: screen; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fire .ground { mix-blend-mode: screen; } }

    @media (max-width: 599px) {
      .wheel { --cy: -14px; block-size: 280px; }
      .wheel-item { inline-size: 150px; block-size: 146px; }
      .wheel-item .pillow { inline-size: 108px; block-size: 100px; }
      .wheel-item .badge { inline-size: 32px; block-size: 32px; inset-inline-start: calc(50% - 16px); }
      .wheel-item .badge .icon { inline-size: 27px; block-size: 27px; }
      .wheel-item .label { font-size: 1.28rem; }
      .wheel .spin { display: none; }   /* on a phone the ring is spun with a finger */
      .fire { --fw: 116px; transform: translateY(calc(var(--cy) - 20px)); }
    }

    /* Letters that swell: each one grows toward the pointer (or ripples in a wave on a long press). */
    .swell { display: inline-block; }
    .swell .ch { display: inline-block; transform-origin: 50% 85%; transition: transform .45s var(--ease-river), color .45s; will-change: transform; }
    .swell.live .ch { transition: transform .09s linear, color .2s; }
    .swell .ch.sp { white-space: pre; }
    .swell .word { display: inline-block; unicode-bidi: isolate; white-space: nowrap; }
    .swell .ch { color: color-mix(in oklab, var(--swell-color, var(--primary)) calc(var(--k, 0) * 100%), currentColor); transform: translateY(calc(var(--k, 0) * -0.2em)) scale(calc(1 + var(--k, 0) * .55)); }
    .swell.wave .ch { animation: wave 1.1s var(--ease-river) calc(var(--i) * 55ms) both; }
    @keyframes wave { 35% { transform: translateY(-.28em) scale(1.55); color: var(--swell-color, var(--primary)); } }

    /* The music corner beside the tent: a stump with a guitar, a record leaning on it (the player), a cushion (the songbook). */
    .corner { position: absolute; z-index: 2; inset-block-end: -2%; inset-inline-end: -34%; inline-size: 40%; aspect-ratio: 1.25; }
    @media (max-width: 1199px) { .corner { inset-inline-end: -6%; inline-size: 34%; inset-block-end: -6%; } }
    @media (max-width: 599px) { .corner { inset-inline-end: -1%; inline-size: 44%; inset-block-end: -10%; } }
    /* on a dark ground the dark cushions keep a faint edge of light */
    :root[data-theme="dark"] .wheel-item .pillow img, :root[data-theme="dark"] .corner .song img { filter: drop-shadow(0 0 1px rgba(255, 236, 210, .45)) drop-shadow(0 10px 8px rgba(0, 0, 0, .45)); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wheel-item .pillow img, :root:not([data-theme="light"]) .corner .song img { filter: drop-shadow(0 0 1px rgba(255, 236, 210, .45)) drop-shadow(0 10px 8px rgba(0, 0, 0, .45)); } }
    /* (positions follow the drawing, which is not mirrored in RTL: stump on the left, guitar on its right; inset-inline-end = from the left here) */
    .corner .stump { position: absolute; inset-inline-end: 22%; inset-block-end: 0; inline-size: 62%; block-size: auto; filter: drop-shadow(0 8px 6px rgba(30, 16, 8, .28)); pointer-events: none; -webkit-user-drag: none; }
    .corner button { position: absolute; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .corner button:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; border-radius: 12px; }
    .corner .tip { position: absolute; inset-block-start: 100%; inset-inline-start: 50%; transform: translateX(50%); margin-block-start: 4px; white-space: nowrap; font-size: .85rem; font-weight: 500;
      color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .corner button:hover .tip, .corner button:focus-visible .tip { opacity: 1; }
    /* the record leans on the stump's side, its label the cover of what's playing */
    .corner .rec { inset-inline-end: -6%; inset-block-end: 2%; inline-size: 34%; aspect-ratio: 1; }
    .corner .record { display: block; inline-size: 100%; block-size: 100%; border-radius: 50%; transform: rotate(-14deg);
      background: radial-gradient(circle, #111 0 4%, transparent 4.5%), radial-gradient(circle, transparent 0 30%, rgba(255, 255, 255, .0) 30%),
        var(--art, radial-gradient(circle, #d2601a 0 30%, transparent 30.5%)) center / 60% 60% no-repeat,
        conic-gradient(from 30deg, rgba(255, 255, 255, .14), transparent 12%, transparent 45%, rgba(255, 255, 255, .1) 55%, transparent 65%),
        repeating-radial-gradient(circle, #1b1916 0 1.6px, #2a2723 1.6px 3px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, .35), inset 0 0 0 2px #0c0b0a; transition: transform .4s var(--ease-river); }
    .corner .record::after { content: ''; position: absolute; inset: 35%; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .35); }
    .corner .rec:hover .record { transform: rotate(-4deg) translateY(-4px); }
    .corner .rec.playing .record { animation: rec-spin 3.5s linear infinite; }
    /* one record (the owner, 2026-11-14): the player's own record parks on the stump (music.js docks it there, body.mu-docked);
       the stump keeps only its place – a faint ring while the record is away, lit while it is dragged near */
    body.mu-one-record .corner .rec .record { visibility: hidden; }
    body.mu-one-record .corner .rec::before { content: ""; position: absolute; inset: 6%; border-radius: 50%; pointer-events: none;
      border: 2px dashed color-mix(in srgb, var(--text) 28%, transparent); opacity: .7; transition: opacity .25s, scale .25s var(--ease-river), border-color .25s; }
    body.mu-one-record.mu-docked .corner .rec::before { opacity: 0; }
    body.mu-one-record.mu-dragging .corner .rec::before { opacity: 1; scale: 1.1; border-color: var(--primary); }
    @keyframes rec-spin { from { transform: rotate(-14deg); } to { transform: rotate(346deg); } }
    /* the guitar: a tap strums it (a soft pluck, a short buzz on a phone) and it sways a little on the stump */
    .corner .guitar { inset-inline-end: 60%; inset-block-end: 5%; inline-size: 25%; block-size: 56%; border-radius: 40% 40% 20% 20%; touch-action: none; }   /* the swipe is the guitar's, not the page's scroll */
    .corner .guitar-img { position: absolute; inset-inline-end: 22%; inset-block-end: 0; inline-size: 62%; block-size: auto; pointer-events: none; -webkit-user-drag: none;
      filter: drop-shadow(0 8px 6px rgba(30, 16, 8, .28)); transform-origin: 74% 99%; }
    /* only the guitar: it rocks off the stump from its foot and comes back to lean on it, with a short buzz of the strings at the start */
    .corner.strum .guitar-img { animation: guitar-sway 1.1s var(--ease-river, ease-out); }
    @keyframes guitar-sway {
      0% { rotate: 0deg; translate: 0 0; }
      4% { translate: .7px 0; } 8% { translate: -.7px 0; } 12% { translate: .5px 0; }
      16% { rotate: 1.4deg; translate: -.5px 0; } 20% { translate: .3px 0; } 24% { translate: -.2px 0; } 28% { translate: 0 0; }
      36% { rotate: 0deg; } 54% { rotate: .55deg; } 72% { rotate: 0deg; } 86% { rotate: .12deg; }
      100% { rotate: 0deg; translate: 0 0; }
    }
    @media (prefers-reduced-motion: reduce) { .corner.strum .guitar-img { animation: none; } }
    :root[data-motion="reduce"] .corner.strum .guitar-img { animation: none; }
    /* the songbook: a cushion on the ground in front of the stump */
    .corner .song { inset-inline-end: 16%; inset-block-end: -10%; inline-size: 44%; }
    .corner .song img { inline-size: 100%; display: block; filter: drop-shadow(0 8px 6px rgba(30, 16, 8, .3)); transition: transform .35s var(--ease-river); -webkit-user-drag: none; }
    .corner .song:hover img { transform: translateY(-4px) rotate(-2deg); }
    .corner .song .badge { position: absolute; inset-block-end: 22%; inset-inline-start: calc(50% - 15px); inline-size: 30px; block-size: 30px; display: grid; place-items: center; color: #fffaf0; pointer-events: none; }
    .corner .song .badge .icon { inline-size: 26px; block-size: 26px; stroke-width: 2.4;
      filter: drop-shadow(0 0 1.5px rgba(20, 10, 4, .95)) drop-shadow(0 0 1px rgba(20, 10, 4, .95)) drop-shadow(0 2px 4px rgba(0, 0, 0, .55)); }


    /* The sky behind the camp: the sun crosses it with the real clock (rising on the east, the left, and setting
       on the west, behind the camp). Kept quiet: a soft tint by day, warm colour around the sun at dawn and dusk. */
    .sky { position: absolute; inset-inline: 0; inset-block-start: 0; z-index: 0; overflow: hidden; pointer-events: none;
      background: linear-gradient(to bottom, var(--sky-top, transparent), transparent 70%), radial-gradient(60% 55% at var(--sun-x, 50%) var(--sun-y, 100%), var(--sky-glow, transparent), transparent 70%);
      transition: background 2s;
      /* the sky ends at the horizon (across the tent): a setting sun sinks into it through a short soft edge */
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 3px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 3px), transparent); }
    /* the horizon: soft, low hill curves right on it (the owner, 2026-11-14: minimal; and low, on the line where the sun and
       the moon meet the ground – they set and rise there, not behind hills above it); a far, paler range and a nearer one */
    .sky::before, .sky::after { content: ""; position: absolute; inset-inline: 0; inset-block-end: 0; z-index: 1; pointer-events: none;
      -webkit-mask: var(--hills) bottom / 100% 100% no-repeat; mask: var(--hills) bottom / 100% 100% no-repeat; }
    .sky::before { block-size: clamp(12px, 2.4vw, 26px); background: color-mix(in srgb, #b9a77a 20%, var(--bg));
      --hills: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 80' preserveAspectRatio='none'><path d='M0 80V46C90 34 170 22 260 26S420 46 520 40 700 14 800 16 980 36 1060 34 1160 24 1200 26V80Z'/></svg>"); }
    .sky::after { block-size: clamp(8px, 1.5vw, 16px); background: color-mix(in srgb, #b39d6a 34%, var(--bg));
      --hills: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 60' preserveAspectRatio='none'><path d='M0 60V30C120 40 220 44 340 34S560 12 680 18 880 42 990 38 1130 20 1200 24V60Z'/></svg>"); }
    .sky.night::before { background: color-mix(in srgb, #3c4a72 26%, var(--bg)); }
    .sky.night::after { background: color-mix(in srgb, #2c3758 40%, var(--bg)); }
    main#root { position: relative; z-index: 1; pointer-events: none; }
    main#root > :not(.home) { pointer-events: auto; }   /* (the sign-in card) */
    /* the empty parts of the page let a click reach the sun behind them */
    .home { pointer-events: none; }
    .home > * { pointer-events: auto; }
    /* beside the side pages the sky lives in the tent's own page (it slides away with it), under the home; the pager takes the
       swipes, the sun and the moon their taps and drags (2026-11-14: in body, behind the pager, they got none) */
    .pager-page:has(> .home) { position: relative; }
    .pager-page > .home { position: relative; z-index: 1; }
    /* the greeting lets the sun through, except its letters (they swell under the pointer) */
    .home > .greet { pointer-events: none; }
    .greet .swell { pointer-events: auto; }
    /* the tent's picture is a rectangle with open sky around the roof: a tap there reaches the sun or the moon behind it,
       while what stands on the tent (the music corner, the companion's wake) still takes its own taps */
    .home > .camp, .home > .camp > img { pointer-events: none; }
    .home > .camp > :not(img):not(.dock):not(.tent-light) { pointer-events: auto; }
    .sun { position: absolute; inset-block-start: 0; left: 0; inline-size: var(--sun-size, 120px); block-size: var(--sun-size, 120px); margin: calc(var(--sun-size, 120px) / -2) 0 0 calc(var(--sun-size, 120px) / -2);
      padding: 0; border: 0; background: none; border-radius: 50%; cursor: pointer; pointer-events: auto; opacity: .85; -webkit-tap-highlight-color: transparent;
      filter: var(--sun-tint, none); transition: filter 2s, opacity .8s; }
    .sun:focus-visible { outline: 2px solid var(--primary); outline-offset: 6px; }
    /* the ball (the drawing's core), with a soft halo of light around it */
    .sun .ball { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; -webkit-user-drag: none; pointer-events: none; transition: scale .5s var(--ease-river), filter .5s; }
    .sun .halo { position: absolute; inset: -55%; border-radius: 50%; pointer-events: none;
      background: radial-gradient(closest-side, rgba(255, 196, 92, var(--halo, .42)), rgba(255, 160, 60, calc(var(--halo, .42) * .35)) 48%, transparent 72%);
      opacity: var(--up, 1); animation: sun-breathe 7s ease-in-out infinite; transition: scale .6s var(--ease-river), opacity .6s; }
    .sun:hover .halo, .sun:focus-visible .halo { scale: 1.12; }
    .sun:hover .ball { filter: brightness(1.05); }
    .sun:active .ball { scale: .94; }
    .sun.flash .halo { animation: sun-flash .9s var(--ease-river); }
    @keyframes sun-breathe { 50% { scale: 1.06; } }   /* (scale only: the opacity is how high it stands, --up) */
    @keyframes sun-flash { 35% { scale: 1.35; } 100% { scale: 1; } }
    /* in night colours (chosen by day) the sun keeps its light low */
    :root[data-theme="dark"] .sun { opacity: .6; --halo: .14; }
    @media (prefers-reduced-motion: reduce) { .sun .halo { animation: none; } }

    /* The moon: the drawing of tonight's real phase (one of eight). It crosses the

      let wheelEnd;
      root.addEventListener('wheel', (e) => {
        const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.shiftKey ? e.deltaY : 0;
        if (!d) return;
        e.preventDefault();
        if (roll) return;
        rot -= d / (rx * step); vel = 0; goal = rot; run();
        clearTimeout(wheelEnd); wheelEnd = setTimeout(() => { goal = Math.round(rot); run(); }, 120);
      }, { passive: false });
      // keys: right-to-left, so ← is the next app
      root.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault();
          spinTo(front + (e.key === 'ArrowLeft' ? 1 : -1));
          setTimeout(() => items[front]?.focus({ preventScroll: true }), 30);
        }
      });

      /* the roulette (the owner, 2026-11-13): a long press on the fire spins the ring like a roulette wheel, fast and then
         slowing, and it stops on a cushion drawn beforehand by a true random draw – so the ring can settle a question among friends */
      const fire = root.querySelector('.fire');
      let press = null, roll = null, chosenT = 0;
      function onFire(e) {
        if (!fire || e.target.closest('.wheel-item')) return false;
        const r = fire.getBoundingClientRect();
        return e.clientX > r.left - 12 && e.clientX < r.right + 12 && e.clientY > r.top - 16 && e.clientY < r.bottom + 8;
      }
      function unpress() { if (press) { clearTimeout(press.t); press = null; } }
      // a finger held on the fire must not open the phone's menu or select anything
      root.addEventListener('contextmenu', (e) => { if (press || roll) e.preventDefault(); });
      function roulette() {
        const r = new Uint32Array(2); crypto.getRandomValues(r);
        const win = r[0] % N;   // the winner, chosen before the spin (N is a handful, so the modulo bias is nil)
        cancelAnimationFrame(raf); raf = 0; last = 0; vel = 0;
        clearTimeout(chosenT); items.forEach((it) => it.classList.remove('chosen'));
        navigator.vibrate?.(14);
        const from = rot, base = Math.round(rot);
        // three or four whole turns, then on to the winner; the ease-out lands on it exactly
        const to = base + mod(win - base) + (reduced ? 0 : N * (3 + (r[1] & 1)));
        if (reduced) { rot = goal = to; layout(); return chosen(win); }
        const t0 = performance.now(), dur = 4200 + (r[1] >>> 1) % 900;
        fire.classList.add('cf-roll');
        roll = {};
        const frame = (now) => {
          const t = Math.min(1, (now - t0) / dur);
          rot = from + (to - from) * (1 - (1 - t) ** 4);
          layout();
          if (t < 1) { roll.raf = requestAnimationFrame(frame); return; }
          rot = goal = to; layout(); roll = null; fire.classList.remove('cf-roll'); chosen(win);
        };
        roll.raf = requestAnimationFrame(frame);
      }
      /** The cushion the roulette stopped on glows warm for a while, and a few sparks leap from the fire. */
      function chosen(win) {
        const it = items[win];
        it.classList.add('chosen');
        caption.textContent = `הגורל נפל על: ${list[win].name}`;
        navigator.vibrate?.([20, 70, 36]);
        if (!reduced) { fire.classList.remove('cf-win'); void fire.offsetWidth; fire.classList.add('cf-win'); setTimeout(() => fire.classList.remove('cf-win'), 1400); }
        chosenT = setTimeout(() => it.classList.remove('chosen'), 4500);
      }

      next.addEventListener('click', () => spinTo(front + 1));
      prev.addEventListener('click', () => spinTo(front - 1));
      window.addEventListener('resize', () => { measure(); layout(); });

      return { root, caption, start(at = 0) { measure(); layout(); goal = at; setTimeout(run, reduced ? 0 : 250); } };
    }
  })();
  </script>
</body>
</html>
