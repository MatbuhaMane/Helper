<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>חדשות</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="news.css">
</head>
<body class="news">
  <div class="shell">
    <aside id="side" class="side" aria-label="מקורות"></aside>
    <section class="listpane" aria-label="כתבות">
      <div class="listbar">
        <button id="menuBtn" class="mini" aria-label="מקורות">☰</button>
        <strong id="listTitle">כל הכתבות</strong>
        <span class="spacer"></span>
        <label class="toggle"><input type="checkbox" id="unreadOnly"> רק לא נקראו</label>
        <button id="viewBtn" class="mini" title="תצוגת כרטיסים / רשימה" aria-label="שנה תצוגה">▦</button>
        <button id="markAll" class="mini" title="סמן הכל כנקרא" aria-label="סמן הכל כנקרא">✓✓</button>
        <button id="refresh" class="mini" title="רענון" aria-label="רענון">⟳</button>
      </div>
      <div id="items" class="items"></div>
    </section>
    <article id="reader" class="reader" aria-live="polite">
      <div class="reader-empty">בחרו כתבה כדי לקרוא אותה כאן 📰<br><small>מקשים: j/k – הבא/הקודם, s – שמור, o – פתח באתר</small></div>
    </article>
  </div>
  <script src="/assets/common.js"></script>
  <script src="news.js"></script>
</body>
</html>
