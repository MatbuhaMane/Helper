<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efeee6">
  <title>כלים</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css">
  <link rel="stylesheet" href="/assets/launcher.css">
</head>
<body>
  <main class="wide"></main>
  <script src="/assets/common.js"></script>
  <script src="/assets/apps.js"></script>
  <script src="/assets/launcher.js"></script>
  <script>
  // Tools: the helpers that sort things out, and the ones still to come.
  // Each one is drawn by its name (an envelope for mail, a screen for the computer…), large and flat with a pastel fill, like אוכל.
  // ארגז הכלים holds every menu of the tent: the person can arrange it, and pin any of them to the ring round the fire (apps.js)
  H.folder({ title: 'כלים', sub: 'עוזרים קטנים לסדר בבית, וכל חלקי האוהל', look: 'flat', arrange: 'tools', apps: [
    { href: '/mail/', ic: 'mail', name: 'סידור המייל', tint: '#ffd1de', c1: '#ff9ab8', c2: '#c9466e' },
    { href: '/pc/', ic: 'pc', name: 'סידור המחשב', tint: '#cfe7ff', c1: '#8cc4f5', c2: '#3f7fc0' },
    { href: '/tools/notes/', ic: 'note', name: 'פתקים', tint: '#fff0b3', c1: '#ffd65c', c2: '#c99a1a' },
    { href: '/tools/calc/', ic: 'calc', name: 'מחשבון', tint: '#d4f2dc', c1: '#86d9a0', c2: '#2f8f55' },
    { href: '/parasha/', ic: 'torah', name: 'פרשת השבוע', tint: '#f4d9c4', c1: '#e0a77f', c2: '#8a4b2a' },
    { href: '/tools/calendar/', ic: 'calendar', name: 'לוח שנה', tint: '#ffd6e0', c1: '#ff9fb8', c2: '#c4476a' },
    { href: '/gather/', ic: 'family', name: 'מפגש משפחתי', tint: '#ffe6bf', c1: '#ffc46b', c2: '#c9782a' },
    // the food apps live in אוכל, and are here too
    { href: '/groceries/', ic: 'cart', name: 'רשימת קניות', tint: '#c6efc6', c1: '#7fd37f', c2: '#2f8f4e' },
    { href: '/groceries/#book', ic: 'book', name: 'ספר מתכונים', tint: '#ffe0b0', c1: '#ffc062', c2: '#e0662a' },
    { href: '/food/diet/', ic: 'diet', name: 'תנועה ותזונה', tint: '#ffcdd4', c1: '#ff9aa8', c2: '#d6405a' },
    { href: '/food/diet/hakpada/', ic: 'target', name: 'הקפדה', tint: '#ffd9c2', c1: '#ffb07a', c2: '#e0533d' },
    { href: '/food/diet/habits/', ic: 'habits', name: 'הרגלי אכילה', tint: '#c8f0ea', c1: '#6fe0d0', c2: '#1f8f8a' },
    { href: '/food/fridge/', ic: 'fridge', name: 'מקרר', tint: '#cfe0f7', c1: '#b5c8e6', c2: '#5a74a8' },
    { href: '/tools/tasks/', ic: 'tasks', name: 'ניהול מטרות', tint: '#e3d9ff', c1: '#b9a3ff', c2: '#6b4fd1' },
    { href: '/tools/research/', ic: 'note', name: 'עוזר מחקר', tint: '#d9ecff', c1: '#9cc8f2', c2: '#2f6aa8' },
    { href: '/tools/weather/', ic: 'weather', name: 'מזג אוויר', tint: '#ffe0cc', c1: '#ffb68a', c2: '#d9692f' },
    // the parts of the tent, so any of them can be pinned to the ring
    { href: '/food/', ic: 'food', name: 'אוכל', tint: '#d4f2dc', c1: '#86d9a0', c2: '#2f7d4a' },
    { href: '/news/', ic: 'news', name: 'חדשות', tint: '#cfe7ff', c1: '#8cc4f5', c2: '#3557a8' },
    { href: '/fun/', ic: 'fun', name: 'בידור', tint: '#fff0b3', c1: '#ffd65c', c2: '#b8457a' },
    { href: '/songs/', ic: 'music', name: 'שירון', tint: '#e3d9ff', c1: '#b9a3ff', c2: '#6b4fd1' },
  ] });
  </script>

</html>
