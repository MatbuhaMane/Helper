name = "helper"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Keep variables set in the dashboard (OWNER_EMAIL lives there, not in this public repo).
keep_vars = true

# The local dev server (npm run dev). An area worktree passes its own: npm run dev -- --port 8789 --inspector-port 9230
[dev]
port = 8788

# schema.sql is bundled as text so the Worker can create its tables on first run.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "helper-db"
database_id = "502f1564-bcd1-4730-ac65-c5de19d3c824"

# Non-secret settings. Secrets (GOOGLE_CLIENT_SECRET, ANTHROPIC_API_KEY,
# GEMINI_API_KEY, TOKEN_KEY) are set with `wrangler secret put` or in the dashboard (Settings -> Variables and Secrets).
# Daemon form pictures (create with: npx wrangler r2 bucket create helper-media)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "helper-media"

[vars]
GOOGLE_CLIENT_ID = "846556847660-jd2jghcnr6i759bsa1togqskhn2oid81.apps.googleusercontent.com"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"
# The Spotify app's client id (public: the sign-in uses PKCE, there is no client secret)
SPOTIFY_CLIENT_ID = "3d73acbf9cea4927bb970c8968387b25"
# Web Push (server/push.ts): the VAPID public key (public by design; its private half is the secret VAPID_PRIVATE)
VAPID_PUBLIC = "BEBWlJ_SMDAakGGX-yR9aa8HrkP3gpgJ88ZrkYIzYCYX_R_puyBHyFhZy3xh4WupAqHSILZESLsqnNr7HORLmsg"

# Previews: every branch other than main is built by Workers Builds with `npx wrangler preview`, which needs this block.
# A preview has its own database and bucket – never the family's – so code that is not merged yet cannot touch real
# family data. The tables are created on first use from schema.sql, as in production.
# Secrets for previews are set apart: `npx wrangler preview secret put <NAME>` (or in the dashboard).
[[previews.d1_databases]]
binding = "DB"
database_name = "helper-db-preview"
database_id = "21e71744-f18f-436c-8b5f-44637d6c91b8"

[[previews.r2_buckets]]
binding = "MEDIA"
bucket_name = "helper-media-preview"

[previews.vars]
GOOGLE_CLIENT_ID = "846556847660-jd2jghcnr6i759bsa1togqskhn2oid81.apps.googleusercontent.com"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"
SPOTIFY_CLIENT_ID = "3d73acbf9cea4927bb970c8968387b25"
# previews sign in through the live site (a public address; see server/core.ts previewHandoff)
PRODUCTION_ORIGIN = "https://helper.shemrivers.workers.dev"

# The vault's nightly backups (server/vault/backup.ts): missing Drive copies, and an encrypted snapshot. 01:30 UTC.
[triggers]
crons = ["30 1 * * *", "0 5 * * *", "* * * * *"]   # the vault backup; the morning note (server/push.ts); the kitchen timers (server/cook.ts)
