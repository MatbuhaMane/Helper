name = "helper"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "helper-db"
database_id = "REPLACE_WITH_D1_ID"

# Non-secret settings. Secrets (GOOGLE_CLIENT_SECRET, ANTHROPIC_API_KEY,
# GEMINI_API_KEY, TOKEN_KEY) are set with `wrangler pages secret put`.
[vars]
OWNER_EMAIL = ""
GOOGLE_CLIENT_ID = ""
GEMINI_MODEL = "gemini-2.5-flash"
